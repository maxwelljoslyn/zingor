changelog:
  exclude:
    labels:
      - ignore-for-release
    authors:
      - dependabot
  categories:
    - title: Features
      labels:
        - enhancement
    - title: Bugfixes
      labels:
        - bug
    - title: Documentation
      labels:
        - docs
    - title: Infrastructure
      labels:
        - infra
    - title: Other Changes
      labels:
        - "*"
